<!DOCTYPE html>
<html>
<body>

<button id="connect">Connect Arduino</button>
<canvas id="canvas" width="128" height="64" style="border:1px solid black;width:512px;height:256px;"></canvas>

<script>
let port;
let writer;

document.getElementById("connect").onclick = async () => {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    writer = port.writable.getWriter();
};

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let drawing = false;

canvas.onmousedown = () => drawing = true;
canvas.onmouseup = () => drawing = false;

canvas.onmousemove = async (e) => {
    if (!drawing || !writer) return;

    const rect = canvas.getBoundingClientRect();

    const x = Math.floor((e.clientX - rect.left) * 128 / rect.width);
    const y = Math.floor((e.clientY - rect.top) * 64 / rect.height);

    ctx.fillRect(x, y, 1, 1);

    const data = `${x},${y}\n`;
    await writer.write(new TextEncoder().encode(data));
};
</script>

</body>
</html>
